<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Contact page</h1>
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#contact">About Me</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="contact">
            <h2>Contact Us</h2>
            <p>Please fill out the form below to get in touch with us.</p>
            <form action="#" method="post">
               <label for="name">Name:</label>
                <input type="text" id="name" name="name" required maxlength="50" title="Please enter your name" >
                <br><br>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number">
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                <br>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" required></textarea>
                <br>
                <fieldset>
                    <legend>Preferred Contact Method</legend>
                    <input type="radio" id="contactEmail" name="contactMethod" value="email" required>
                    <label for="contactEmail">Email</label><br>
                    <input type="radio" id="contactPhone" name="contactMethod" value="phone" required>
                    <label for="contactPhone">Phone</label><br>
                </fieldset>
                <br>
                <input type="submit" value="Submit">
                <input type="reset" value="Cancel">
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Your Company. All rights reserved.</p>
    </footer>
</body>
</html>
