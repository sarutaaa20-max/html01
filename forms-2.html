<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form id="contactForm" novalidate>
    <fieldset>
        <legend>Personal Information</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required maxlength="50"><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" title="Please enter a valid email address"><br><br>
        <label for="salary">Salary:</label>
        <input type="number" name="salary" id="salary" min="0" max="100000" step="1000"><br><br>
        <label for="national-id">National ID:</label>
        <input type="text" id="national-id" name="national-id" required pattern="\d{13}" title="Please enter a valid 13-digit National ID"><br><br>
    </fieldset>
    <fieldset>
        <legend>Contact Information</legend>
        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone">
        

    </fieldset>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel"><br><br> 
        </form>

</body>
</html>
