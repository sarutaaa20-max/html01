<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <!--style>
        /* Add your CSS styles here */
        /* @import url('style.css'); */
    </style>-->
    <style>
        h1 ,h2{
        color: blue;
        text-align: center;
    }
     div{
        background-color: lightgray;
        padding: 20px;
        margin: 10px;
     }
     p{
       font-size: 16px;
       color: yellow;
       background-color: red;
    }
     #div-id1 {
       background-color: lightblue;
       padding: 20px;
       margin: 10px;   
    }
     #div-id2 {
       background-color: lightgreen;
       padding: 20px;
       margin: 10px;   
    }
     .div-class {
       border: 2px solid black;
       padding: 20px;
    }
     h1, #div-id1, #div-id2, .div-class {
       border-radius: 10px;
       font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    } 
     a:hover{
       color: red;
       text-decoration: underline;
    }
     a:visited{
       color: purple;
   }
    </style>
</head>
<body>
    <h1>Welcome to My Website</h1>
    <h2 style="color: green;background-color: aqua;">This is a subheading</h2>
    <div>
        <p>This is a simple paragraph inside the div element.</p>
    </div>
    <div>
        <p>This is another paragraph inside the div element.</p>
    </div>
    <div id="div-id2" class="div-class">
        <p>This is a paragraph inside the second div element.</p>
    </div>
    <a href="https://www.example.com" target="_blank">Visit Example.com</a>

</body>
</html>
