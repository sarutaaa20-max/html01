<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Authentication form</h3>
    <form action="#" method="get">
        <label for="txtUsername">User name</label>
        <input type="text" name="txtUsername" placeholder="รหัสผู้ใช้" required><br><br>
        <label for="txtPassword">Password</label>
        <input type="password" name="txtPassword" placeholder="รหัสผ่าน" required><br><br>
        <input type="submit" value="Login">
        <input type="reset" value="Cancel">
    </form>
    <h3>Input types Example</h3>
    <form action="#" method="get">
        <label for="txtUsername">User name</label>
        <input type="text" name="txtUsername" placeholder="รหัสผู้ใช้" required><br><br>
        <label for="txtPassword">Password</label>
        <input type="password" name="txtPassword" placeholder="รหัสผ่าน" required><br><br>
        <label for="txtEmail">Email</label>
        <input type="email" name="txtEmail" placeholder="อีเมลล์" required><br><br>
        <label for="txtTel">Tel</label>
        <input type="tel" name="txtTel" placeholder="เบอร์โทรศัพท์" required><br><br>
        <label for="txtUrl">URL</label>
        <input type="url" name="txtUrl" placeholder="เว็บไซต์"><br><br>
        <label for="txtNumber">Number</label>
        <input type="number" name="txtNumber" placeholder="ตัวเลข"><br><br>
        <label for="txtDate">Date</label>
        <input type="date" name="txtDate"><br><br>
        <label for="txtColor">Color</label>
        <input type="color" name="txtColor"><br><br>
        <input type="hidden" name="txtHidden" value="hidden value">
         <label for="txtmeal">Meal</label><br>
        <input type="checkbox" name="txtmeal-1" id="txtmeal-1">ข้าวผัด<br>
        <input type="checkbox" name="txtmeal-2" id="txtmeal-2">ข้าวมันไก่<br>
        <input type="checkbox" name="txtmeal-3" id="txtmeal-3">ข้าวพริกเกลือไก่<br>
         <label for="txtgender">Gender</label><br>
        <input type="radio" name="txtgender" id="txtgender-1">ชาย<br>
        <input type="radio" name="txtgender" id="txtgender-2">หญิง<br>
        <input type="radio" name="txtgender" id="txtgender-3">สมศรี<br>
        <label for="txtFile">File</label><br>
        <input type="file" name="txtFile" id="txtfile"><br><br>
        <label for="txtTextarea">Textarea</label><br>
        <textarea name="txtTextarea" id="txtTextarea" cols="30" rows="10"></textarea><br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel">
</body>
</html>
